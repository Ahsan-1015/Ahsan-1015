name: Pacman Contribution

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pacman:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Ahsan-1015
          plugin_pacman: yes
          plugin_pacman_segments: 1,2,3,4
          filename: pacman-contribution-graph.svg
